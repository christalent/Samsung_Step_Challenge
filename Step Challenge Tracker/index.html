    <title>Step Challenge Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        h1 {
            color: #58a6ff;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }
        
        h2 {
            color: #8b949e;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 10px;
            margin-top: 25px;
        }
        
        .status-bar {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 10px 15px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #8b949e;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-bar .connected { color: #238636; }
        .status-bar .offline { color: #f85149; }
        
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
        }
        
        .stat-card .label {
            font-size: 0.75rem;
            color: #8b949e;
            text-transform: uppercase;
        }
        
        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 600;
            color: #c9d1d9;
            margin-top: 5px;
        }
        
        .stat-card .value.highlight { color: #58a6ff; }
        .stat-card .value.goal { color: #3fb950; }
        .stat-card .value.warning { color: #d29922; }
        .stat-card .value.behind { color: #d29922; }
        
        /* Step Input Section */
        .step-input-section {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .step-input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .step-input-row input[type="number"] {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 1.2rem;
            padding: 10px 15px;
            width: 200px;
            -moz-appearance: textfield;
        }
        .step-input-row input[type="number"]::-webkit-outer-spin-button,
        .step-input-row input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        .step-input-row button {
            background: #238636;
            border: 1px solid #238636;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            padding: 10px 20px;
            cursor: pointer;
        }
        
        .step-input-row button:hover { background: #2ea043; }
        
        .last-updated {
            font-size: 0.8rem;
            color: #8b949e;
            margin-top: 10px;
        }
        
        /* Month Filter */
        .filter-row {
            margin-bottom: 15px;
        }
        
        .filter-row select {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 1rem;
            padding: 8px 15px;
            min-width: 150px;
        }
        
        /* Table */
        .table-wrapper {
            overflow-x: auto;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }
        
        thead { background: #1c2128; }
        
        th {
            padding: 12px 15px;
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #8b949e;
            font-weight: 600;
            border-bottom: 1px solid #30363d;
        }
        
        td {
            padding: 10px 15px;
            border-bottom: 1px solid #21262d;
            font-size: 0.9rem;
        }
        
        tr:last-child td { border-bottom: none; }
        
        tr.completed { opacity: 0.5; }
        
        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #238636;
        }
        
        input[type="date"], input[type="number"] {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            color: #c9d1d9;
            padding: 5px 8px;
            font-size: 0.85rem;
        }
        
        input[type="date"] { width: 130px; }
        input[type="number"] { width: 100px; }
        
        .star-num { font-weight: 600; color: #d29922; }
        .star-num.star-active { color: #3fb950; text-shadow: 0 0 8px rgba(63, 185, 80, 0.5); }
        .steps-required { color: #8b949e; font-size: 0.8rem; }
        
        .loading, .error {
            padding: 20px;
            text-align: center;
            color: #58a6ff;
        }
        .error { color: #f85149; }
        
        @media (max-width: 700px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .stat-card .value { font-size: 1.4rem; }
            .step-input-row { flex-direction: column; align-items: stretch; }
            .step-input-row input[type="number"] { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⭐ Step Challenge Tracker</h1>
        
        <div class="status-bar">
            <span id="status-text">Checking OwnCloud connection...</span>
            <span id="sync-status"></span>
        </div>
        
        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="label">Current Steps</div>
                <div class="value highlight" id="current-steps">—</div>
            </div>
            <div class="stat-card">
                <div class="label">Monthly Total</div>
                <div class="value highlight" id="monthly-total">—</div>
            </div>
            <div class="stat-card">
                <div class="label">Avg Daily Steps</div>
                <div class="value highlight" id="avg-daily">—</div>
            </div>
            <div class="stat-card">
                <div class="label">Steps to Next Star</div>
                <div class="value goal" id="steps-to-next-star">—</div>
            </div>
            <div class="stat-card">
                <div class="label">Today's Target</div>
                <div class="value goal" id="todays-target">—</div>
            </div>
            <div class="stat-card">
                <div class="label">Daily Avg for 200K Goal</div>
                <div class="value goal" id="needed-daily">—</div>
            </div>
            <div class="stat-card">
                <div class="label">Remaining to 200K</div>
                <div class="value goal" id="remaining">—</div>
            </div>
        </div>
        
        <div class="step-input-section">
            <div class="step-input-row">
                <input type="number" id="steps-input" placeholder="Enter current steps..." min="0">
                <button onclick="updateSteps()">Update</button>
            </div>
            <div class="step-input-row" style="margin-top:8px;">
                <input type="number" id="monthly-input" placeholder="Monthly total for selected year+month..." min="0">
                <button onclick="updateMonthlyTotal()">Save</button>
            </div>
            <div class="last-updated" id="last-updated"></div>
        </div>
        
        <h2>Star Challenges</h2>
        <div class="filter-row">
            <select id="month-filter" onchange="filterTable()">
                <option value="all">All Months</option>
                <option value="JANUARY">January</option>
                <option value="FEBRUARY">February</option>
                <option value="MARCH">March</option>
                <option value="APRIL">April</option>
                <option value="MAY">May</option>
                <option value="JUNE">June</option>
                <option value="JULY">July</option>
                <option value="AUGUST">August</option>
                <option value="SEPTEMBER">September</option>
                <option value="OCTOBER">October</option>
                <option value="NOVEMBER">November</option>
                <option value="DECEMBER">December</option>
            </select>
            &nbsp;
            <select id="year-filter" onchange="filterTable()">
                <option value="all">All Years</option>
                <option value="2026" selected>2026</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
                <option value="2023">2023</option>
                <option value="2022">2022</option>
                <option value="2021">2021</option>
                <option value="2020">2020</option>
                <option value="2019">2019</option>
            </select>
        </div>
        
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>✓</th>
                        <th>Star</th>
                        <th>Month</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Date Completed</th>
                        <th>Steps</th>
                    </tr>
                </thead>
                <tbody id="challenge-body">
                    <tr><td colspan="7" class="loading">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        // ========== CHALLENGE DATA (embedded - no fetch needed) ==========
        const CHALLENGE_DATA = {
            "challenge_tiers": [
                {"name":"JANUARY","challenges":[{"star":1,"steps":20000,"start_day":2,"end_day":4},{"star":2,"steps":35000,"start_day":5,"end_day":7},{"star":3,"steps":70000,"start_day":11,"end_day":13},{"star":4,"steps":100000,"start_day":16,"end_day":18},{"star":5,"steps":150000,"start_day":23,"end_day":25},{"star":6,"steps":200000,"start_day":31,"end_day":31}]},
                {"name":"FEBRUARY","challenges":[{"star":1,"steps":30000,"start_day":3,"end_day":5},{"star":2,"steps":70000,"start_day":8,"end_day":10},{"star":3,"steps":100000,"start_day":12,"end_day":14},{"star":4,"steps":130000,"start_day":18,"end_day":20},{"star":5,"steps":170000,"start_day":23,"end_day":25},{"star":6,"steps":200000,"start_day":28,"end_day":28}]},
                {"name":"MARCH","challenges":[{"star":1,"steps":20000,"start_day":1,"end_day":3},{"star":2,"steps":60000,"start_day":6,"end_day":8},{"star":3,"steps":90000,"start_day":11,"end_day":13},{"star":4,"steps":120000,"start_day":18,"end_day":20},{"star":5,"steps":160000,"start_day":23,"end_day":25},{"star":6,"steps":200000,"start_day":31,"end_day":31}]},
                {"name":"APRIL","challenges":[{"star":1,"steps":20000,"start_day":2,"end_day":4},{"star":2,"steps":35000,"start_day":5,"end_day":7},{"star":3,"steps":70000,"start_day":10,"end_day":13},{"star":4,"steps":100000,"start_day":16,"end_day":18},{"star":5,"steps":150000,"start_day":23,"end_day":25},{"star":6,"steps":200000,"start_day":30,"end_day":30}]},
                {"name":"MAY","challenges":[{"star":1,"steps":30000,"start_day":3,"end_day":5},{"star":2,"steps":70000,"start_day":8,"end_day":10},{"star":3,"steps":100000,"start_day":12,"end_day":14},{"star":4,"steps":130000,"start_day":17,"end_day":20},{"star":5,"steps":170000,"start_day":23,"end_day":25},{"star":6,"steps":200000,"start_day":31,"end_day":31}]},
                {"name":"JUNE","challenges":[{"star":1,"steps":20000,"start_day":2,"end_day":4},{"star":2,"steps":35000,"start_day":5,"end_day":7},{"star":3,"steps":70000,"start_day":10,"end_day":13},{"star":4,"steps":100000,"start_day":16,"end_day":18},{"star":5,"steps":150000,"start_day":23,"end_day":25},{"star":6,"steps":200000,"start_day":30,"end_day":30}]},
                {"name":"JULY","challenges":[{"star":1,"steps":25000,"start_day":2,"end_day":4},{"star":2,"steps":65000,"start_day":6,"end_day":8},{"star":3,"steps":100000,"start_day":12,"end_day":14},{"star":4,"steps":140000,"start_day":17,"end_day":19},{"star":5,"steps":180000,"start_day":23,"end_day":25},{"star":6,"steps":200000,"start_day":31,"end_day":31}]},
                {"name":"AUGUST","challenges":[{"star":1,"steps":20000,"start_day":2,"end_day":4},{"star":2,"steps":35000,"start_day":5,"end_day":7},{"star":3,"steps":70000,"start_day":12,"end_day":14},{"star":4,"steps":100000,"start_day":16,"end_day":18},{"star":5,"steps":150000,"start_day":23,"end_day":25},{"star":6,"steps":200000,"start_day":31,"end_day":31}]},
                {"name":"SEPTEMBER","challenges":[{"star":1,"steps":30000,"start_day":3,"end_day":5},{"star":2,"steps":70000,"start_day":8,"end_day":10},{"star":3,"steps":100000,"start_day":12,"end_day":14},{"star":4,"steps":130000,"start_day":18,"end_day":20},{"star":5,"steps":170000,"start_day":23,"end_day":25},{"star":6,"steps":200000,"start_day":30,"end_day":30}]},
                {"name":"OCTOBER","challenges":[{"star":1,"steps":20000,"start_day":1,"end_day":3},{"star":2,"steps":60000,"start_day":6,"end_day":8},{"star":3,"steps":90000,"start_day":11,"end_day":13},{"star":4,"steps":120000,"start_day":18,"end_day":20},{"star":5,"steps":160000,"start_day":23,"end_day":25},{"star":6,"steps":200000,"start_day":31,"end_day":31}]},
                {"name":"NOVEMBER","challenges":[{"star":1,"steps":30000,"start_day":3,"end_day":5},{"star":2,"steps":70000,"start_day":8,"end_day":10},{"star":3,"steps":100000,"start_day":12,"end_day":14},{"star":4,"steps":130000,"start_day":18,"end_day":20},{"star":5,"steps":170000,"start_day":23,"end_day":25},{"star":6,"steps":200000,"start_day":30,"end_day":30}]},
                {"name":"DECEMBER","challenges":[{"star":1,"steps":20000,"start_day":1,"end_day":3},{"star":2,"steps":60000,"start_day":6,"end_day":8},{"star":3,"steps":90000,"start_day":11,"end_day":13},{"star":4,"steps":120000,"start_day":18,"end_day":20},{"star":5,"steps":160000,"start_day":23,"end_day":25},{"star":6,"steps":200000,"start_day":31,"end_day":31}]}
            ]
        };

        // ========== OWN CLOUD WEBDAV CONFIG ==========
        const API_URL = 'api.php'; // PHP backend on same host
        
        
        
        // ========== STATE ==========
        let userData = null;
        let exceptionsData = null;
        let saveTimeout = null;
        
        // ========== INIT ==========
        async function init() {
            updateStatus('Connecting to OwnCloud...', '');
            await loadUserData();
            await loadExceptions();
            renderTable();
            updateStats();
            updateLastUpdated();
            updateStatus('Connected to OwnCloud', 'connected');
            
            // Auto-select current month in filter
            document.getElementById('month-filter').value = getCurrentMonthName();
            filterTable();
            
            document.getElementById('steps-input').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') updateSteps();
            });
        }
        
        // ========== STATUS ==========
        function updateStatus(text, type) {
            const el = document.getElementById('status-text');
            el.textContent = text;
            el.className = type;
        }
        
        function showSync(msg) {
            document.getElementById('sync-status').textContent = msg;
        }
        
        // ========== DATA LOAD/SAVE ==========
        async function loadExceptions() {
            try {
                const resp = await fetch(API_URL + '?type=exceptions');
                if (resp.ok) {
                    exceptionsData = await resp.json();
                }
            } catch (e) {
                console.warn('Could not load exceptions:', e);
                exceptionsData = { exceptions: {} };
            }
        }
        
        async function loadUserData() {
            try {
                const resp = await fetch(API_URL, {
                    method: 'GET',
                });
                
                if (resp.ok) {
                    const data = await resp.json();
                    userData = data;
                } else {
                    // File doesn't exist yet, use defaults
                    userData = getDefaultUserData();
                }
            } catch (e) {
                // OwnCloud unavailable, try localStorage
                console.warn('OwnCloud unavailable, using localStorage:', e);
                updateStatus('OwnCloud offline - using local storage', 'offline');
                const stored = localStorage.getItem('stepTracker_v1');
                if (stored) {
                    userData = JSON.parse(stored);
                } else {
                    userData = getDefaultUserData();
                }
            }
            
            // Ensure completionDates is always an object, not an array (fixes corrupted data)
            if (Array.isArray(userData.completionDates)) {
                userData.completionDates = {};
            }
            if (!userData.completionDates || typeof userData.completionDates !== 'object') {
                userData.completionDates = {};
            }
        }
        
        function getDefaultUserData() {
            return {
                currentSteps: 0,
                completedStars: {},
                completionDates: {},
                monthlySteps: {},
                lastUpdated: null
            };
        }
        
        async function saveUserData() {
            userData.lastUpdated = new Date().toISOString();
            
            // Debounce saves
            if (saveTimeout) clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
                showSync('Saving...');
                try {
                    const resp = await fetch(API_URL, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(userData)
                    });
                    
                    if (resp.ok || resp.status === 201 || resp.status === 204) {
                        showSync('Saved ✓');
                        setTimeout(() => showSync(''), 2000);
                    } else {
                        throw new Error('Save failed: ' + resp.status);
                    }
                } catch (e) {
                    console.warn('OwnCloud save failed, using localStorage:', e);
                    localStorage.setItem('stepTracker_v1', JSON.stringify(userData));
                    showSync('Saved (local) ✓');
                    setTimeout(() => showSync(''), 2000);
                }
            }, 500);
        }
        
        // ========== CALCULATIONS ==========
        function getDaysInMonth(year, month) {
            return new Date(year, month + 1, 0).getDate();
        }
        
        function getMonthIndex(monthName) {
            return ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE',
                    'JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'].indexOf(monthName);
        }
        
        function getCurrentMonthName() {
            const months = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE',
                           'JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
            return months[new Date().getMonth()];
        }
        
        function formatDate(year, month, day) {
            return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }
        
        function getExceptionDates(year, monthName, star) {
            if (!exceptionsData || !exceptionsData.exceptions) return null;
            const key = `${year}-${monthName.toUpperCase().substring(0,3).toUpperCase()}`;
            const monthKey = `${year}-${monthName.toUpperCase()}`;
            if (exceptionsData.exceptions[monthKey] && exceptionsData.exceptions[monthKey][star]) {
                return exceptionsData.exceptions[monthKey][star];
            }
            return null;
        }
        
        function calcStartEndDates(monthName, startDay, endDay, star) {
            const now = new Date();
            const year = now.getFullYear();
            const monthIdx = getMonthIndex(monthName);
            const daysInMonth = getDaysInMonth(year, monthIdx);
            
            // Check for exception dates
            const exception = getExceptionDates(year, monthName, star);
            if (exception) {
                startDay = exception.start_day;
                endDay = exception.end_day;
            }
            
            return {
                start: formatDate(year, monthIdx, Math.min(startDay, daysInMonth)),
                end: formatDate(year, monthIdx, Math.min(endDay, daysInMonth))
            };
        }
        
        function isChallengeActive(monthName, startDay, endDay, star) {
            const now = new Date();
            const currentMonth = getCurrentMonthName();
            if (monthName !== currentMonth) return false;
            const today = now.getDate();
            
            // Check for exception dates
            const year = now.getFullYear();
            const exception = getExceptionDates(year, monthName, star);
            if (exception) {
                startDay = exception.start_day;
                endDay = exception.end_day;
            }
            
            return today >= startDay && today <= endDay;
        }
        
        // ========== UI UPDATES ==========
        function updateStats() {
            const now = new Date();
            const dayOfMonth = now.getDate();
            const daysInMonth = getDaysInMonth(now.getFullYear(), now.getMonth());
            const daysLeft = daysInMonth - dayOfMonth;
            
            const currentSteps = userData.currentSteps || 0;
            const remaining = Math.max(0, 200000 - currentSteps);
            const avgDaily = dayOfMonth > 0 ? Math.round(currentSteps / dayOfMonth) : 0;
            const neededDaily = daysLeft > 0 ? Math.round(remaining / daysLeft) : remaining;
            const todaysTarget = Math.round((200000 / daysInMonth) * dayOfMonth);
            const stepsToNextStar = calcStepsToNextStar(currentSteps);
            
            const now = new Date();
            const year = now.getFullYear();
            const monthName = getCurrentMonthName();
            const monthKey = `${year}-${monthName}`;
            const monthlyTotal = userData.monthlySteps ? userData.monthlySteps[monthKey] : null;
            
            document.getElementById('current-steps').textContent = currentSteps.toLocaleString();
            document.getElementById('monthly-total').textContent = monthlyTotal ? monthlyTotal.toLocaleString() : '—';
            document.getElementById('remaining').textContent = remaining.toLocaleString();
            document.getElementById('todays-target').textContent = todaysTarget.toLocaleString();
            document.getElementById('avg-daily').textContent = avgDaily.toLocaleString();
            document.getElementById('steps-to-next-star').textContent = stepsToNextStar.toLocaleString();
            
            const neededEl = document.getElementById('needed-daily');
            neededEl.textContent = neededDaily.toLocaleString();
            neededEl.className = 'value goal' + (neededDaily > avgDaily && avgDaily > 0 ? ' behind' : '');
        }
        
        function calcStepsToNextStar(currentSteps) {
            const currentMonth = getCurrentMonthName();
            const monthObj = CHALLENGE_DATA.challenge_tiers.find(m => m.name === currentMonth);
            if (!monthObj) return 0;
            
            const completed = userData.completedStars[currentMonth] || [];
            const now = new Date();
            const today = now.getDate();
            
            // Find active incomplete star (today within window)
            for (const chal of monthObj.challenges) {
                if (completed.includes(chal.star)) continue;
                if (today >= chal.start_day && today <= chal.end_day) {
                    return Math.max(0, chal.steps - currentSteps);
                }
            }
            
            // No active star — find next upcoming incomplete star
            const upcoming = monthObj.challenges
                .filter(c => !completed.includes(c.star) && c.start_day > today)
                .sort((a, b) => a.start_day - b.start_day);
            
            if (upcoming.length > 0) {
                return Math.max(0, upcoming[0].steps - currentSteps);
            }
            
            // All stars done — return 0
            return 0;
        }
        
        function updateLastUpdated() {
            const el = document.getElementById('last-updated');
            if (userData.lastUpdated) {
                const date = new Date(userData.lastUpdated);
                el.textContent = `Last updated: ${date.toLocaleDateString()} ${date.toLocaleTimeString()}`;
            } else {
                el.textContent = '';
            }
        }
        
        function updateSteps() {
            const input = document.getElementById('steps-input');
            const val = parseInt(input.value);
            
            // Don't update if empty or not a number
            if (isNaN(val) || input.value.trim() === '') {
                input.value = '';
                return;
            }
            
            // Confirm if lowering step count
            if (val < userData.currentSteps) {
                if (!confirm(`Lower step count from ${userData.currentSteps.toLocaleString()} to ${val.toLocaleString()}?`)) {
                    input.value = '';
                    return;
                }
            }
            
            userData.currentSteps = Math.max(0, val);
            saveUserData();
            updateStats();
            updateLastUpdated();
            input.value = '';
        }
        
        function updateMonthlyTotal() {
            const input = document.getElementById('monthly-input');
            const val = parseInt(input.value);
            
            if (isNaN(val) || input.value.trim() === '') {
                input.value = '';
                return;
            }
            
            const yearFilter = document.getElementById('year-filter').value;
            const monthFilter = document.getElementById('month-filter').value;
            
            if (yearFilter === 'all' || monthFilter === 'all') {
                alert('Select a specific year and month to save monthly total.');
                return;
            }
            
            const monthKey = `${yearFilter}-${monthFilter}`;
            if (!userData.monthlySteps) userData.monthlySteps = {};
            userData.monthlySteps[monthKey] = Math.max(0, val);
            
            saveUserData();
            updateStats();
            updateLastUpdated();
            input.value = '';
        }
        
        // ========== TABLE RENDERING ==========
        function renderTable() {
            const tbody = document.getElementById('challenge-body');
            const now = new Date();
            const currentMonth = getCurrentMonthName();
            let html = '';
            
            for (const monthObj of CHALLENGE_DATA.challenge_tiers) {
                const month = monthObj.name;
                
                for (const chal of monthObj.challenges) {
                    const key = `${month}_${chal.star}`;
                    const isCompleted = userData.completedStars[month]?.includes(chal.star);
                    const completionDate = userData.completionDates[key] || '';
                    const dates = calcStartEndDates(month, chal.start_day, chal.end_day, chal.star);
                    
                    const isActive = isChallengeActive(month, chal.start_day, chal.end_day, chal.star);
                    const year = new Date().getFullYear();
                    html += `<tr class="${isCompleted ? 'completed' : ''}${isActive ? ' active-row' : ''}" data-month="${month}" data-year="${year}">
                        <td>
                            <input type="checkbox" 
                                   ${isCompleted ? 'checked' : ''} 
                                   onchange="toggleStar('${month}', ${chal.star}, this.checked)">
                        </td>
                        <td class="star-num${isActive ? ' star-active' : ''}">★${chal.star}</td>
                        <td>${month}</td>
                        <td>${dates.start}</td>
                        <td>${dates.end}</td>
                        <td>
                            <input type="date" 
                                   value="${completionDate}"
                                   onchange="setCompletionDate('${month}', ${chal.star}, this.value)">
                        </td>
                        <td class="steps-required">${chal.steps.toLocaleString()}</td>
                    </tr>`;
                }
            }
            
            tbody.innerHTML = html;
        }
        
        function filterTable() {
            const yearFilter = document.getElementById('year-filter').value;
            const monthFilter = document.getElementById('month-filter').value;
            const rows = document.querySelectorAll('#challenge-body tr');
            rows.forEach(row => {
                const matchYear = yearFilter === 'all' || row.dataset.year === yearFilter;
                const matchMonth = monthFilter === 'all' || row.dataset.month === monthFilter;
                row.style.display = (matchYear && matchMonth) ? '' : 'none';
            });
            updateDateInputConstraints();
        }
        
        function updateDateInputConstraints() {
            const yearFilter = document.getElementById('year-filter').value;
            const monthFilter = document.getElementById('month-filter').value;
            const rows = document.querySelectorAll('#challenge-body tr');
            rows.forEach(row => {
                const dateInput = row.querySelector('input[type="date"]');
                if (!dateInput) return;
                if (yearFilter === 'all' || monthFilter === 'all') {
                    dateInput.removeAttribute('min');
                    dateInput.removeAttribute('max');
                } else {
                    const monthIdx = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'].indexOf(monthFilter) + 1;
                    const daysInMonth = new Date(parseInt(yearFilter), monthIdx, 0).getDate();
                    const minDate = `${yearFilter}-${String(monthIdx).padStart(2,'0')}-01`;
                    const maxDate = `${yearFilter}-${String(monthIdx).padStart(2,'0')}-${String(daysInMonth).padStart(2,'0')}`;
                    dateInput.min = minDate;
                    dateInput.max = maxDate;
                }
            });
        }
        
        // ========== INTERACTIONS ==========
        function toggleStar(month, star, checked) {
            if (!userData.completedStars[month]) {
                userData.completedStars[month] = [];
            }
            
            if (checked) {
                if (!userData.completedStars[month].includes(star)) {
                    userData.completedStars[month].push(star);
                }
                const key = `${month}_${star}`;
                if (!userData.completionDates[key]) {
                    userData.completionDates[key] = new Date().toISOString().split('T')[0];
                    const rows = document.querySelectorAll(`#challenge-body tr[data-month="${month}"]`);
                    rows.forEach(row => {
                        const starText = row.querySelector('.star-num')?.textContent || '';
                        const starNum = parseInt(starText.replace('★', ''));
                        if (starNum === star) {
                            row.querySelector('input[type="date"]').value = userData.completionDates[key];
                        }
                    });
                }
            } else {
                if (!confirm(`Uncheck Star ${star} for ${month}? (Date completed will be retained.)`)) {
                    // Restore checkbox to checked state
                    const rows = document.querySelectorAll(`#challenge-body tr[data-month="${month}"]`);
                    rows.forEach(row => {
                        const starText = row.querySelector('.star-num')?.textContent || '';
                        const starNum = parseInt(starText.replace('★', ''));
                        if (starNum === star) {
                            row.querySelector('input[type="checkbox"]').checked = true;
                        }
                    });
                    return;
                }
                userData.completedStars[month] = userData.completedStars[month].filter(s => s !== star);
                // Keep completionDates[key] - don't delete
            }
            
            // Update row styling
            const rows = document.querySelectorAll(`#challenge-body tr[data-month="${month}"]`);
            rows.forEach(row => {
                const starText = row.querySelector('.star-num')?.textContent || '';
                const starNum = parseInt(starText.replace('★', ''));
                if (starNum === star) {
                    row.classList.toggle('completed', checked);
                }
            });
            
            saveUserData();
        }
        
        function setCompletionDate(month, star, date) {
            const key = `${month}_${star}`;
            if (date) {
                userData.completionDates[key] = date;
                if (!userData.completedStars[month]?.includes(star)) {
                    if (!userData.completedStars[month]) userData.completedStars[month] = [];
                    userData.completedStars[month].push(star);
                    const rows = document.querySelectorAll(`#challenge-body tr[data-month="${month}"]`);
                    rows.forEach(row => {
                        const starText = row.querySelector('.star-num')?.textContent || '';
                        const starNum = parseInt(starText.replace('★', ''));
                        if (starNum === star) {
                            row.querySelector('input[type="checkbox"]').checked = true;
                            row.classList.add('completed');
                        }
                    });
                }
            } else {
                delete userData.completionDates[key];
            }
            saveUserData();
        }
        
        // ========== START ==========
        init();
    </script>
</body>
</html>
